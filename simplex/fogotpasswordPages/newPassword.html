<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="fogotpasswordPages.css">
    <link rel="stylesheet" href="newPassword.css">
    <title>Login & Registration Form</title>
</head>
<body>
      <div class="forgot-password-wrapper">
            <img src="../assets/simpex-logo.png" alt="Logo" class="forgot-password-logo">
            <header>New password</header>
            <form action="#">
              <div class="forgot-password-field forgot-password-email">
                <div class="label-email">Enter new password</div>
                <div class="forgot-password-input-area">
                  <input type="password" placeholder="must contain 8 characters">
                  <i class="uil uil-envelope icon"></i>
                  <i class="forgot-password-error forgot-password-error-icon fas fa-exclamation-circle"></i>
                </div>
                <div class="forgot-password-error forgot-password-error-txt">Email can't be blank</div>
              </div>

              <div class="forgot-password-field forgot-password-email">
                <div class="label-email">Conform password</div>
                <div class="forgot-password-input-area">
                  <input type="password" placeholder="conform password">
                  <i class="uil uil-envelope icon"></i>
                  <i class="forgot-password-error forgot-password-error-icon fas fa-exclamation-circle"></i>
                </div>
                <div class="forgot-password-error forgot-password-error-txt">Email can't be blank</div>
              </div>
              <input type="submit" value="Send"  onclick="handleSubmit(event)">         
            </form>
        </div>

        <div id="new-password-popup" class="new-password-popup">
            <div class="popup-content">
                <img src="../assets/check-circle.svg" alt="" class="check-circle">
                <h2>Success</h2>
                <button onclick="closePopup()">Close</button>
            </div>
        </div>
  <script src="./newPassword.js"></script>
</body>
</html>
