<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="fogotpasswordPages.css">
    <title>Login & Registration Form</title>
</head>
<body>
      <div class="forgot-password-wrapper">
            <img src="../assets/simpex-logo.png" alt="Logo" class="forgot-password-logo">
            <header>Verification</header>
            <form action="#">
              <div class="forgot-password-field forgot-password-email">
                <div class="label-email">Check your email and enter verification code</div>
                <div class="forgot-password-input-area">
                  <input type="text" placeholder="Email Address">
                  <i class="uil uil-envelope icon"></i>
                  <i class="forgot-password-error forgot-password-error-icon fas fa-exclamation-circle"></i>
                </div>
                <div class="forgot-password-error forgot-password-error-txt">Email can't be blank</div>
              </div>
              <input type="submit" value="Send"  onclick="handleSubmit(event)">
            </form>
            <div class="forgot-password-txt">Didn't received the code? <a href="./fogotPassword.html">Resend</a></div>
        </div>
  <script src="./fogetVerification.js"></script>
</body>
</html>
