<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Template</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/dashboardtemplate.css" />
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <img
          src="assets/images/userimg.jpg"
          alt="manager profile-picture"
          class="profile-picture"
        />
        <a href="#" class="active">
          <h3>Dashboard</h3>
        </a>
        <a href="#">
          <h3>Customers</h3>
        </a>
        <a href="#">
          <h3>Projects</h3>
        </a>
        <a href="#">
          <h3>Inventory</h3>
        </a>
        <a href="#">
          <h3>Employees</h3>
        </a>
        <a href="#">
          <span class="material-icons-sharp">logout</span>
          <h3>Logout</h3>
        </a>
      </div>
      <div class="content">
        <h3>Hello Oshada Yomal!</h3>
        <div class="cards">
          <div class="project-card">
            <div class="card-content">
              <h3 class="title">Projects</h3>
              <h3 class="number">69</h3>
            </div>
          </div>
          <div class="client-card">
            <div class="card-content">
              <h3 class="title">Clients</h3>
              <h3 class="number">34</h3>
            </div>
          </div>
          <div class="employee-card">
            <div class="card-content">
              <h3 class="title">Employees</h3>
              <h3 class="number">25</h3>
            </div>
          </div>
        </div>

        <div class="customer">
          <h2>Customers</h2>

          <div class="customer-card">
            <div class="top-controls">
              <div class="search">
                <label>
                  <span class="material-symbols-outlined search-icon"
                    >search</span
                  >
                  <input type="text" placeholder="Search here" />
                </label>
              </div>

              <button type="button" class="add-button">
                <span class="button-text">Add</span>
                <span class="button-icon">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke-linejoin="round"
                    stroke-linecap="round"
                    stroke="currentColor"
                    height="24"
                    fill="none"
                    class="svg"
                  >
                    <line y2="19" y1="5" x2="12" x1="12"></line>
                    <line y2="12" y1="12" x2="19" x1="5"></line>
                  </svg>
                </span>
              </button>
            </div>

            <table class="customer-table">
              <thead>
                <tr>
                  <th>Image</th>
                  <th>Name</th>
                  <th>Status</th>
                  <th>Availability</th>
                  <th></th>
                  <th></th>
                  <th></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div class="suppliers">
          <h2>Suppliers</h2>
          <div class="supplier-cards"></div>
        </div>

        <div class="form-section">
          <div class="form-container">
            <header>Registration Form</header>
            <form action="#" class="form">
              <div class="input-box">
                <label>Full Name</label>
                <input type="text" placeholder="Enter full name" required />
              </div>
              <div class="input-box">
                <label>Email Address</label>
                <input type="text" placeholder="Enter email address" required />
              </div>
              <div class="column">
                <div class="input-box">
                  <label>Phone Number</label>
                  <input
                    type="number"
                    placeholder="Enter phone number"
                    required
                  />
                </div>
                <div class="input-box">
                  <label>Birth Date</label>
                  <input type="date" placeholder="Enter birth date" required />
                </div>
              </div>
              <div class="gender-box">
                <h3>Gender</h3>
                <div class="gender-option">
                  <div class="gender">
                    <input type="radio" id="check-male" name="gender" checked />
                    <label for="check-male">male</label>
                  </div>
                  <div class="gender">
                    <input type="radio" id="check-female" name="gender" />
                    <label for="check-female">Female</label>
                  </div>
                  <div class="gender">
                    <input type="radio" id="check-other" name="gender" />
                    <label for="check-other">prefer not to say</label>
                  </div>
                </div>
              </div>
              <div class="input-box address">
                <label>Address</label>
                <input
                  type="text"
                  placeholder="Enter street address"
                  required
                />
                <input
                  type="text"
                  placeholder="Enter street address line 2"
                  required
                />
                <div class="column">
                  <div class="select-box">
                    <select>
                      <option hidden>Country</option>
                      <option>America</option>
                      <option>Japan</option>
                      <option>India</option>
                      <option>Nepal</option>
                    </select>
                  </div>
                  <input type="text" placeholder="Enter your city" required />
                </div>
                <div class="column">
                  <input type="text" placeholder="Enter your region" required />
                  <input
                    type="number"
                    placeholder="Enter postal code"
                    required
                  />
                </div>
              </div>
              <button>Submit</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div id="editPopup" class="popup">
      <form id="editForm">
        <h3>Edit Customer</h3>
        <label for="editName">Name:</label>
        <input type="text" id="editName" name="name" required />

        <label for="editStatus">Status:</label>
        <input type="text" id="editStatus" name="status" required />

        <label for="editAvailability">Availability:</label>
        <select id="editAvailability" name="availability" required>
          <option value="In Stock">In Stock</option>
          <option value="Out of Stock">Out of Stock</option>
          <option value="Low Stock">Low Stock</option>
        </select>

        <div class="popup-buttons">
          <button type="submit" class="save-button">Save</button>
          <button
            type="button"
            class="cancel-button"
            onclick="closeEditPopup()"
          >
            Cancel
          </button>
        </div>
      </form>
    </div>

    <!-- Confirmation Box for Deletion -->
    <div id="confirmDelete" class="popup">
      <p>Are you sure you want to delete this customer?</p>
      <div class="popup-buttons">
        <button class="delete-button" onclick="confirmDelete()">Yes</button>
        <button class="cancel-button" onclick="closeDeletePopup()">No</button>
      </div>
    </div>

    <!-- Overlay -->
    <div id="overlay" class="overlay"></div>

    <script src="assets/js/index.js"></script>
  </body>
</html>
