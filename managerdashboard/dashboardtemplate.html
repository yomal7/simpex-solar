<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Template</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/dashboardtemplate.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <img src="assets/images/userimg.jpg" alt="manager profile-picture" class="profile-picture">
            <a href="#" class="active">
                <h3>Dashboard</h3>
            </a>
            <a href="#">
                <h3>Customers</h3>
            </a>
            <a href="#">
                <h3>Projects</h3>
            </a>
            <a href="#">
                <h3>Inventory</h3>
            </a>
            <a href="#">
                <h3>Employees</h3>
            </a>
            <a href="#">
                <span class="material-icons-sharp">logout</span>
                <h3>Logout</h3>
            </a>
        </div>
        <div class="content">
            <h3>Hello Oshada Yomal!</h3>
            <div class="cards">
                <div class="project-card">
                    <div class="card-content">
                        <h3 class="title">Projects</h3>
                        <h3 class="number">69</h3>
                    </div>
                </div>
                <div class="client-card">
                    <div class="card-content">
                        <h3 class="title">Clients</h3>
                        <h3 class="number">34</h3>
                    </div>
                </div>
                <div class="employee-card">
                    <div class="card-content">
                        <h3 class="title">Employees</h3>
                        <h3 class="number">25</h3>
                    </div>
                </div>
            </div>

            <div class="customer">
                <h2>Customers</h2>
            
                <div class="customer-card">
                    <div class="top-controls">
                        <div class="search">
                            <label>
                                <span class="material-symbols-outlined search-icon">search</span>
                                <input type="text" placeholder="Search here">
                            </label>
                        </div>
                
                        <button type="button" class="add-button">
                            <span class="button-text">Add</span>
                            <span class="button-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke="currentColor" height="24" fill="none" class="svg">
                                    <line y2="19" y1="5" x2="12" x1="12"></line>
                                    <line y2="12" y1="12" x2="19" x1="5"></line>
                                </svg>
                            </span>
                        </button>
                    </div>
                
                    <table class="customer-table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Status</th>
                                <th>Availability</th>
                                <th></th>
                                <th></th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
            
            <div class="suppliers">
                <h2>Suppliers</h2>
                <div class="supplier-cards">
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/index.js"></script>
</body>
</html>
