services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html/simpex-solar
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: simpex_db
    ports:
      - "3306:3306"
    volumes:
      - ./dev/simpex_db.sql:/docker-entrypoint-initdb.d/init.sql
